[package]
name = "analysis"
version = "2.0.0"
edition = "2024"

[dependencies]
roxmltree = "0.21"
tracing = "0.1"
indexmap = "2"
proc-macro2 = { version = "1", default-features = false }
quote = { version = "1", default-features = false }
syn = { version = "2", default-features = false, features = [
    "parsing",
    "full",
] }
tinyvec = "1.10.0"

[dev-dependencies]
tracing-test = "0.2"
